version: "3.8"

services:

  # ─── MongoDB ────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: shrinkly_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: shrinkly123
      MONGO_INITDB_DATABASE: shrinkly
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shrinkly_net

  # ─── Mongo Express (Web UI for MongoDB) ─────────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: shrinkly_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: shrinkly123
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: shrinkly123
      ME_CONFIG_MONGODB_URL: mongodb://admin:shrinkly123@mongo:27017/
    ports:
      - "8081:8081"
    networks:
      - shrinkly_net

# ─── Volumes & Networks ──────────────────────────────────────
volumes:
  mongo_data:
    driver: local

networks:
  shrinkly_net:
    driver: bridge
