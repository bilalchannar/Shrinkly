services:
  # 1. Backend API Service
  - type: web
    name: shrinkly-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: CRON_ENABLED
        value: "true"
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # 2. Frontend React SPA Service (Static Site)
  - type: web
    name: shrinkly-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      # Rewrites all requests to index.html to support React Router client-side routing
      - src: /*
        dest: /index.html
        type: rewrite
    envVars:
      - key: REACT_APP_API_URL
        sync: false
